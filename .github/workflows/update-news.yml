name: 뉴스 자동 수집

on:
  schedule:
    - cron: "7 * * * *"      # 매시간 7분 (UTC 기준, 한국시간도 매시 7분)
  push:
    paths: ["orgs.txt", "collector.py"]   # 기관 목록을 고치면 바로 수집
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 수집
        run: python collector.py
      - name: 변경분 저장
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
